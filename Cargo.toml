[package]
name = "cucumber"
version = "0.4.1"
edition = "2021"
description = "黄瓜 · 跨平台本地进程与服务统一管理工具（GUI + 本地 API/WS/MCP）"
license = "MIT"
repository = "https://github.com/cucumber-tool/cucumber"
readme = "README.md"
keywords = ["process-manager", "gui", "mcp", "cross-platform"]
categories = ["gui", "development-tools"]

[[bin]]
name = "cucumber"
path = "src/main.rs"

[dependencies]
windui = "0.30"
sysinfo = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "sync", "time", "io-util", "macros"] }
axum = { version = "0.8", features = ["ws", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

# 图标资产渲染工具（cargo run --example gen_icon_assets）：SVG 为唯一设计真相源
[[example]]
name = "gen_icon_assets"
path = "examples/gen_icon_assets.rs"

[dev-dependencies.resvg]
version = "0.48"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
