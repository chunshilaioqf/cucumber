[package]
name = "cucumber"
version = "0.2.0"
edition = "2021"
description = "黄瓜 · 跨平台本地进程与服务统一管理工具（GUI + 本地 API/WS/MCP）"
license = "MIT"
repository = "https://github.com/cucumber-tool/cucumber"
readme = "README.md"
keywords = ["process-manager", "gui", "mcp", "cross-platform"]
categories = ["gui", "development-tools"]

[[bin]]
name = "cucumber"
path = "src/main.rs"

[dependencies]
windui = "0.30"
sysinfo = "0.39"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
directories = "6"
rand = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "sync", "time", "io-util", "macros"] }
axum = { version = "0.8", features = ["ws", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
tempfile = "3"

[build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
