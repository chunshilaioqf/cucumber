name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN_NAME: cucumber # 与 Cargo.toml 的 [[bin]] name 保持一致

jobs:
  # ---------- 版本一致性校验：tag 与 Cargo.toml 必须一致（7.5） ----------
  check-version:
    name: Check tag/version consistency
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Compare tag with Cargo.toml version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed 's/version *= *"\(.*\)"/\1/')
          echo "tag=${TAG} cargo=${CARGO_VER}"
          if [ "${TAG}" != "${CARGO_VER}" ]; then
            echo "::error::tag(${TAG}) 与 Cargo.toml(${CARGO_VER}) 版本不一致"
            exit 1
          fi

  # ---------- 构建各平台产物 ----------
  build:
    name: Build (${{ matrix.label }})
    needs: check-version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
          - label: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            ext: .exe
          - label: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            ext: ""
          - label: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - label: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            ext: ""
          - label: macos-x86_64
            os: macos-14
            target: x86_64-apple-darwin
            ext: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev pkg-config

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      # 打包：各平台统一输出 <bin>-<version>-<label>.zip / .tar.gz
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          $dir = "dist/$env:BIN_NAME-$ver-${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME${{ matrix.ext }}" $dir
          Copy-Item "README.md" $dir -ErrorAction SilentlyContinue
          Copy-Item "LICENSE*" $dir -ErrorAction SilentlyContinue
          Compress-Archive -Path "$dir/*" -DestinationPath "dist/$env:BIN_NAME-$ver-${{ matrix.label }}.zip" -Force

      - name: Build Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart("v")
          choco install -y innosetup --no-progress | Out-Null
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "${env:ProgramFiles}\Inno Setup 6\ISCC.exe" }
          & $iscc /DAppVer="$ver" "/DArchLabel=${{ matrix.label }}" "/DBinDir=target/${{ matrix.target }}/release" installer/cucumber.iss
          Get-ChildItem dist/*setup.exe | ForEach-Object { Write-Host "installer: $($_.Name)" }

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          strip "$bin" || true
          mkdir -p "dist/${BIN_NAME}-${ver}-${{ matrix.label }}"
          cp "$bin" "dist/${BIN_NAME}-${ver}-${{ matrix.label }}/"
          cp README.md LICENSE* "dist/${BIN_NAME}-${ver}-${{ matrix.label }}/" 2>/dev/null || true
          tar -czf "dist/${BIN_NAME}-${ver}-${{ matrix.label }}.tar.gz" \
            -C "dist/${BIN_NAME}-${ver}-${{ matrix.label }}" .

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          bin="target/${{ matrix.target }}/release/${BIN_NAME}"
          strip "$bin" || true
          # 供 universal job 使用的中间产物（最终用户包为 DMG）
          mkdir -p dist
          cp "$bin" "dist/${BIN_NAME}-${{ matrix.label }}.raw"

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  # ---------- macOS 通用 DMG（lipo 合并 + .app bundle） ----------
  macos-universal:
    name: Build (macos-universal DMG)
    needs: build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: pkg-macos-*
          merge-multiple: true

      - name: Merge arm64 + x86_64 into universal, bundle as DMG
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          lipo -create \
            "artifacts/${BIN_NAME}-macos-aarch64.raw" \
            "artifacts/${BIN_NAME}-macos-x86_64.raw" \
            -output "${BIN_NAME}-universal"
          chmod +x "${BIN_NAME}-universal"
          lipo -info "${BIN_NAME}-universal"
          mkdir -p dist
          bash scripts/macos-bundle.sh "${BIN_NAME}-universal" "${ver}" dist
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: pkg-macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  # ---------- 发布到 GitHub Release ----------
  release:
    name: Publish GitHub Release
    needs: [build, macos-universal]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: pkg-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.zip *.tar.gz *.dmg > SHA256SUMS 2>/dev/null || true
          cat SHA256SUMS

      - name: Compose release body (按系统与芯片分组的下载指引)
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          cat > /tmp/body.md <<BODY
          ## 下载

          按你的操作系统与芯片选择（文件在本页底部 Assets 中）：

          | 系统 | 芯片 | 安装包 | 安装方式 |
          |---|---|---|---|
          | macOS 12+ | Apple Silicon（M1/M2/M3/M4） | \`cucumber-${ver}-macos-universal.dmg\` | 双击挂载 → 把「黄瓜」拖入 Applications → 启动台打开 |
          | macOS 12+ | Intel | \`cucumber-${ver}-macos-universal.dmg\`（同包双架构） | 同上 |
          | Windows 10+ | x64（主流 PC） | \`cucumber-${ver}-windows-x86_64.zip\` | 解压 → 双击 \`cucumber.exe\` |
          | Windows 10+ | ARM64（Surface 等） | \`cucumber-${ver}-windows-arm64.zip\` | 同上 |
          | Linux | x86_64 | \`cucumber-${ver}-linux-x86_64.tar.gz\` | \`tar xf\` 后运行 \`./cucumber\`（X11） |
          | Linux | ARM64 | \`cucumber-${ver}-linux-aarch64.tar.gz\` | 同上 |

          > macOS 首次运行如被 Gatekeeper 拦截：右键 App →「打开」，或终端执行
          > \`xattr -d com.apple.quarantine /Applications/Cucumber.app\`
          > （未做 Developer ID 签名公证，正式分发见 README 说明）。

          ## 校验

          下载后可用 \`SHA256SUMS\` 校验完整性：\`sha256sum -c SHA256SUMS\`。
          BODY
          echo "body written"

      - name: Create / update release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          body_path: /tmp/body.md
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.dmg
            dist/SHA256SUMS
